<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#C7CED1" />
    <title>Salish Sea</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 8c3-4 9-4 12 0l2-2v6l-2-2C10 14 4 14 1 8z%22 fill=%22%239E3B2A%22/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/fraunces-logbook.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- Persistent HUD. Screens (catch card, market, Log) are built by src/ui/*. -->
    <div id="hud">
      <div class="hud-top">
        <div class="hud-top-left">
          <button class="tab shells" id="shells" aria-label="Shells — open the Log">
            <span class="ico" data-icon="shell"></span>
            <span id="shell-count" class="odo num">0</span>
          </button>
          <div class="tab cooler" id="cooler-tab" aria-label="Cooler">
            <div id="cooler" class="slots"></div>
            <span class="chip full-chip">Full</span>
          </div>
        </div>
        <div class="hud-top-center">
          <div id="compass" class="ribbon compass hidden" aria-live="polite">
            <svg viewBox="0 0 24 24" class="arrow" id="compass-arrow"><path d="M12 2.5 18.5 20 12 16.2 5.5 20z" fill="#B5643C" stroke="#2B2622" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span id="compass-label">Cedar Landing</span>
          </div>
          <div id="clock" class="tab clock">
            <span class="ico" id="clock-ico" data-icon="cloud"></span>
            <span id="clock-time" class="num">10:40</span>
          </div>
        </div>
        <div class="hud-top-right">
          <button class="tab log-btn" id="btn-log" aria-label="Open the Log">
            <span class="ico" data-icon="log"></span><span>Log</span>
            <b id="log-badge" class="badge num hidden">0</b>
            <b id="log-stamps" class="stamp-count num hidden" title="Stamps on the cover">0</b>
          </button>
        </div>
      </div>

      <div id="fps" class="hidden"></div>
      <div id="world-badge" class="hidden"></div>

      <div id="joy-base"><div id="joy-knob"></div></div>
      <div id="target-marker" class="hidden"><svg viewBox="0 0 24 30"><path d="M12 28 3 14h5V3h8v11h5z" fill="#F4EFE3" stroke="#2B2622" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
      <div id="strike" class="hidden"><div class="splat"><span>Strike!</span></div><svg class="window" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg></div>

      <div class="hud-controls">
        <button id="btn-interact" class="ctx hidden" aria-label="Interact">
          <span class="ico" id="interact-ico" data-icon="cleat"></span>
          <span id="interact-label">Tie up</span>
          <kbd>E</kbd>
        </button>
        <button id="btn-action" class="reel-btn" aria-label="Cast">
          <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="power" cx="50" cy="50" r="47"/>
            <g class="spin">
              <circle cx="50" cy="50" r="36" class="hub"/>
              <path d="M50 16v68M16 50h68M26 26l48 48M74 26 26 74" class="spokes"/>
              <path d="M50 50 74 22" class="arm"/>
              <circle cx="74" cy="22" r="8" class="nub"/>
            </g>
          </svg>
          <span id="action-label">Cast</span>
          <kbd>Space</kbd>
        </button>
      </div>

      <div id="tension" class="tension hidden"></div>

      <div id="toasts"></div>
      <div id="hints"></div>
      <div id="skip-hint" class="hidden">Tap to skip</div>
    </div>

    <div id="loading">
      <svg class="sketch" viewBox="0 0 200 110" aria-hidden="true">
        <path d="M14 70c30-6 140-6 172 0-10 14-36 22-86 22S24 84 14 70z" fill="none" stroke="#2B2622" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M30 72c40 4 100 4 140 0M60 70l-6-16M140 70l6-16" fill="none" stroke="#6B5E52" stroke-width="1.4"/>
        <path d="M100 66V20l30 40H100" fill="none" stroke="#2B2622" stroke-width="2"/>
        <path d="M6 100c20-6 30 6 50 0s30-6 50 0 30 6 50 0 30-6 38 0" fill="none" stroke="#2E5E63" stroke-width="1.6" stroke-dasharray="5 4"/>
      </svg>
      <div class="title">Salish Sea</div>
      <p class="tip" id="load-tip">Fish bite best where the water wrinkles.</p>
      <div class="rule"><div id="load-bar"></div></div>
      <div id="load-msg">Loading…</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
